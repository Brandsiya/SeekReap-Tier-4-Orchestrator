services:
  - type: web
    name: seekreap-tier-4-orchestrator
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn tier4_main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: TIER3_URL
        value: https://seekreap-tier-3-private.onrender.com
