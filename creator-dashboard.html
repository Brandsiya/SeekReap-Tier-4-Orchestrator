<!DOCTYPE html>
<html>
<head><title>SeekReap Proof</title></head>
<body>
  <h1>🔥 SeekReap Human Verification - LIVE</h1>
  <input id="reap_id" placeholder="Enter post ID" style="padding:10px;font-size:16px">
  <button onclick="verify()" style="padding:10px 20px;font-size:16px">Verify Human</button>
  <div id="result"></div>
  <script>
  async function verify() {
    const reap_id = document.getElementById('reap_id').value;
    document.getElementById('result').innerHTML = '<p>Verifying...</p>';
    try {
      const response = await fetch('http://41.56.248.204:10000/v4/verify', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({reap_id})
      });
      const data = await response.json();
      document.getElementById('result').innerHTML = `
        <div style="background:#e8f5e8;padding:20px;border-radius:10px">
          <h2>✅ HUMAN VERIFIED (15/15 Global Quorum)</h2>
          <pre style="background:#f0f0f0;padding:15px">${JSON.stringify(data, null, 2)}</pre>
          <p><b>Certificate ID:</b> <span style="color:#0066cc;font-size:18px">${data.certificate_id}</span></p>
          <p><b>Copy this to Facebook appeal:</b></p>
          <textarea style="width:100%;height:80px">${data.certificate_id}</textarea>
          <p><em>Submit to Facebook → Revenue restored in 24-48hrs</em></p>
        </div>
      `;
    } catch(e) {
      document.getElementById('result').innerHTML = '<p style="color:red">Error - check server</p>';
    }
  }
  </script>
</body>
</html>
