<!DOCTYPE html>
<html>
<head>
    <title>Correct API Test</title>
</head>
<body>
    <h1>Correct API Test</h1>
    <p>Using the correct endpoint: /process-video</p>
    <div>
        <input type="text" id="videoId" value="123456789012345" placeholder="Video ID">
        <input type="text" id="creatorId" value="user_123456" placeholder="Creator ID">
        <input type="text" id="title" value="My Video" placeholder="Title">
        <label>
            <input type="checkbox" id="music" value="false"> Uses Third Party Music
        </label>
        <button onclick="testAPI()">Test API</button>
    </div>
    <pre id="result" style="background: #f0f0f0; padding: 10px; margin-top: 20px;"></pre>

    <script>
        async function testAPI() {
            const videoId = document.getElementById('videoId').value;
            const creatorId = document.getElementById('creatorId').value;
            const title = document.getElementById('title').value;
            const usesThirdPartyMusic = document.getElementById('music').checked;
            
            const resultEl = document.getElementById('result');
            
            resultEl.textContent = 'Calling API...';
            
            try {
                const requestBody = {
                    creatorId: creatorId,
                    videoUrl: 'https://facebook.com/watch/?v=' + videoId,
                    title: title,
                    usesThirdPartyMusic: usesThirdPartyMusic
                };
                
                console.log('Calling API with:', requestBody);
                
                const response = await fetch('https://seekreap-tier-4-orchestrator.onrender.com/process-video', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(requestBody)
                });
                
                console.log('Response status:', response.status);
                
                const responseText = await response.text();
                console.log('Response text:', responseText);
                
                let data;
                try {
                    data = JSON.parse(responseText);
                    resultEl.textContent = JSON.stringify(data, null, 2);
                } catch (e) {
                    resultEl.textContent = responseText;
                }
                
            } catch (error) {
                console.error('Error:', error);
                resultEl.textContent = 'Error: ' + error.message;
            }
        }
    </script>
</body>
</html>
