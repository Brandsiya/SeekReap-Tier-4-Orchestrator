<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SeekReap Tier-4 Verification Portal</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<h1>SeekReap Video Verification</h1>
<section id="upload-section">
  <form id="videoForm">
    <label>Creator ID: <input type="text" id="creatorId" value="creator_1" required></label><br>
    <label>Video URL: <input type="text" id="videoUrl" placeholder="https://example.com/video.mp4" required></label><br>
    <label>Title: <input type="text" id="title" placeholder="Video Title" required></label><br>
    <label>Uses 3rd-party music: <input type="checkbox" id="usesMusic"></label><br>
    <button type="submit">Submit for Verification</button>
  </form>
</section>
<section id="result-section">
  <h2>Processed Video</h2>
  <div id="result"></div>
</section>
<section id="history-section">
  <h2>All Processed Videos</h2>
  <table id="historyTable" border="1">
    <thead>
      <tr><th>Video ID</th><th>Title</th><th>Creator ID</th><th>Status</th><th>PDF Report</th></tr>
    </thead>
    <tbody></tbody>
  </table>
</section>
<script src="scripts.js"></script>
</body>
</html>
