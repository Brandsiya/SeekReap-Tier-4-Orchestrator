<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up / Sign In - SeekReap</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Inter',sans-serif;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem}
        .auth-container{background:white;max-width:450px;width:100%;border-radius:20px;padding:3rem;box-shadow:0 30px 80px rgba(0,0,0,0.3)}
        .auth-tabs{display:flex;border-bottom:2px solid #e5e7eb;margin-bottom:2rem}
        .tab-btn{flex:1;padding:1rem;font-weight:600;cursor:pointer;border:none;background:none;transition:all 0.2s}
        .tab-btn.active{border-bottom:3px solid #00c851;color:#00c851}
        .form-group{margin-bottom:1.5rem}
        .form-group label{display:block;margin-bottom:0.5rem;font-weight:500;color:#374151}
        .form-group input{width:100%;padding:1rem;border:2px solid #e5e7eb;border-radius:12px;font-size:1rem;transition:all 0.2s}
        .form-group input:focus{border-color:#00c851;outline:none;box-shadow:0 0 0 3px rgba(0,200,81,0.1)}
        .cta-btn{width:100%;padding:1.25rem;background:#00c851;color:white;border:none;border-radius:12px;font-size:1.1rem;font-weight:600;cursor:pointer;transition:all 0.2s}
        .cta-btn:hover{background:#00a843;transform:translateY(-1px)}
        .toggle-link{color:#00c851;text-decoration:none;font-weight:500}
        .social-login{display:flex;gap:1rem;margin-top:2rem}
        .social-btn{flex:1;padding:1rem;border:2px solid #e5e7eb;border-radius:12px;text-decoration:none;color:#374151;font-weight:500;display:flex;align-items:center;justify-content:center;gap:0.5rem;transition:all 0.2s}
        .social-btn:hover{background:#f3f4f6;border-color:#d1d5db}
        h1{text-align:center;margin-bottom:1rem;color:#1f2937;font-size:2rem;font-weight:700}
        .subtitle{text-align:center;color:#6b7280;margin-bottom:2rem;font-size:1.1rem}
    </style>
</head>
<body>
    <div class="auth-container">
        <h1>SeekReap</h1>
        <p class="subtitle">Access your certificates & dashboard</p>
        
        <div class="auth-tabs">
            <button class="tab-btn active" onclick="switchTab('signup')">Sign Up</button>
            <button class="tab-btn" onclick="switchTab('signin')">Sign In</button>
        </div>

        <!-- Sign Up Form -->
        <form id="signupForm" style="display:block">
            <div class="form-group">
                <label>Email</label>
                <input type="email" placeholder="your@email.com" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" placeholder="Create password" required>
            </div>
            <div class="form-group">
                <label>Confirm Password</label>
                <input type="password" placeholder="Confirm password" required>
            </div>
            <button type="submit" class="cta-btn">Create Account</button>
        </form>

        <!-- Sign In Form -->
        <form id="signinForm" style="display:none">
            <div class="form-group">
                <label>Email</label>
                <input type="email" placeholder="your@email.com" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" placeholder="Enter password" required>
            </div>
            <button type="submit" class="cta-btn">Sign In</button>
            <a href="#" class="toggle-link" style="display:block;text-align:center;margin-top:1rem">Forgot Password?</a>
        </form>

        <div style="text-align:center;margin-top:2rem;color:#6b7280">or continue with</div>
        <div class="social-login">
            <a href="#" class="social-btn"><i class="fab fa-google"></i> Google</a>
            <a href="#" class="social-btn"><i class="fab fa-facebook-f"></i> Facebook</a>
        </div>
    </div>

    <script>
        function switchTab(tab) {
            const signupForm = document.getElementById('signupForm');
            const signinForm = document.getElementById('signinForm');
            const tabs = document.querySelectorAll('.tab-btn');
            
            tabs.forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            
            if (tab === 'signup') {
                signupForm.style.display = 'block';
                signinForm.style.display = 'none';
            } else {
                signupForm.style.display = 'none';
                signinForm.style.display = 'block';
            }
        }

        document.getElementById('signupForm').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('Account created! Welcome to SeekReap 🚀');
            // Production: Create account API
        });

        document.getElementById('signinForm').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('Signed in successfully! Redirecting to dashboard...');
            // Production: Auth API
        });
    </script>
</body>
</html>
