<!DOCTYPE html>
<html>
<head>
    <title>Ultra Simple API Test</title>
</head>
<body>
    <h1>Ultra Simple API Test</h1>
    <div id="status">Ready</div>
    <button onclick="testAPI()">Test API</button>
    <pre id="result" style="background:#f0f0f0;padding:10px;margin-top:20px;"></pre>

    <script>
        async function testAPI() {
            const resultEl = document.getElementById('result');
            const statusEl = document.getElementById('status');
            
            statusEl.textContent = 'Calling API...';
            resultEl.textContent = '';
            
            const payload = {
                creatorId: 'user_123456',
                videoUrl: 'https://facebook.com/watch/?v=123456789012345',
                title: 'Test Video',
                usesThirdPartyMusic: false
            };
            
            try {
                console.log('Sending payload:', payload);
                
                const response = await fetch('https://seekreap-tier-4-orchestrator.onrender.com/process-video', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(payload)
                });
                
                console.log('Response status:', response.status);
                console.log('Response headers:', [...response.headers.entries()]);
                
                const responseText = await response.text();
                console.log('Response text:', responseText);
                
                statusEl.textContent = 'Response received';
                resultEl.textContent = `Status: ${response.status}\n\n${responseText}`;
                
            } catch (error) {
                console.error('Error:', error);
                statusEl.textContent = 'Error';
                resultEl.textContent = 'Error: ' + error.message;
            }
        }
    </script>
</body>
</html>
