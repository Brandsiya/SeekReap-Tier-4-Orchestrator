<!DOCTYPE html>
<html>
<head>
    <title>Minimal API Test</title>
</head>
<body>
    <h1>Minimal API Test</h1>
    <div>
        <input type="text" id="videoId" value="123456789012345" placeholder="Video ID">
        <select id="tier">
            <option value="test">Test</option>
            <option value="custom" selected>Custom</option>
        </select>
        <button onclick="testAPI()">Test API</button>
    </div>
    <pre id="result" style="background: #f0f0f0; padding: 10px; margin-top: 20px;"></pre>

    <script>
        async function testAPI() {
            const videoId = document.getElementById('videoId').value;
            const tier = document.getElementById('tier').value;
            const resultEl = document.getElementById('result');
            
            resultEl.textContent = 'Calling API...';
            
            try {
                console.log('Calling API with:', { videoId, tier });
                
                const response = await fetch('https://seekreap-tier-4-orchestrator.onrender.com/api/verify', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ videoId, tier })
                });
                
                console.log('Response status:', response.status);
                console.log('Response headers:', [...response.headers.entries()]);
                
                const responseText = await response.text();
                console.log('Response text:', responseText);
                
                let data;
                try {
                    data = JSON.parse(responseText);
                    resultEl.textContent = JSON.stringify(data, null, 2);
                } catch (e) {
                    resultEl.textContent = responseText;
                }
                
            } catch (error) {
                console.error('Error:', error);
                resultEl.textContent = 'Error: ' + error.message;
            }
        }
    </script>
</body>
</html>
