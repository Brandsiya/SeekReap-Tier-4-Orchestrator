<!DOCTYPE html>
<html>
<head>
    <title>Debug SeekReap API</title>
    <style>
        body { font-family: monospace; padding: 20px; }
        .success { color: green; }
        .error { color: red; }
        pre { background: #f4f4f4; padding: 10px; border-radius: 5px; }
        button { padding: 10px 20px; margin: 10px 0; }
        input, select { padding: 8px; margin: 5px; width: 300px; }
    </style>
</head>
<body>
    <h1>🔍 Debug SeekReap API</h1>
    
    <div>
        <h3>Test 1: Direct API Call</h3>
        <input type="text" id="videoId" value="123456789012345" placeholder="Video ID">
        <select id="tier">
            <option value="test">Test</option>
            <option value="custom" selected>Custom</option>
            <option value="bronze">Bronze</option>
        </select>
        <button onclick="testDirectAPI()">Test Direct API</button>
        <pre id="directResult">Click button to test...</pre>
    </div>

    <div>
        <h3>Test 2: Check if API is reachable</h3>
        <button onclick="testHealth()">Test Health Endpoint</button>
        <pre id="healthResult">Click button to test...</pre>
    </div>

    <div>
        <h3>Test 3: Check CORS</h3>
        <button onclick="testCORS()">Test CORS</button>
        <pre id="corsResult">Click button to test...</pre>
    </div>

    <script>
        const API_URL = 'https://seekreap-tier-4-orchestrator.onrender.com';

        async function testDirectAPI() {
            const videoId = document.getElementById('videoId').value;
            const tier = document.getElementById('tier').value;
            const resultEl = document.getElementById('directResult');
            
            resultEl.textContent = 'Testing...';
            resultEl.className = '';
            
            const requestBody = {
                creatorId: 'user_' + Date.now().toString().slice(-6),
                videoUrl: 'https://facebook.com/watch/?v=' + videoId,
                title: 'Video ' + videoId,
                usesThirdPartyMusic: false
            };
            
            try {
                console.log('Sending request:', requestBody);
                
                const response = await fetch(API_URL + '/process-video', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(requestBody)
                });
                
                const responseText = await response.text();
                console.log('Response status:', response.status);
                console.log('Response:', responseText);
                
                resultEl.textContent = `Status: ${response.status}\n\n${responseText}`;
                resultEl.className = response.ok ? 'success' : 'error';
                
            } catch (error) {
                console.error('Error:', error);
                resultEl.textContent = 'Error: ' + error.message;
                resultEl.className = 'error';
            }
        }

        async function testHealth() {
            const resultEl = document.getElementById('healthResult');
            resultEl.textContent = 'Testing...';
            
            try {
                const response = await fetch(API_URL + '/health');
                const text = await response.text();
                resultEl.textContent = `Status: ${response.status}\n\n${text}`;
                resultEl.className = response.ok ? 'success' : 'error';
            } catch (error) {
                resultEl.textContent = 'Error: ' + error.message;
                resultEl.className = 'error';
            }
        }

        async function testCORS() {
            const resultEl = document.getElementById('corsResult');
            resultEl.textContent = 'Testing...';
            
            try {
                const response = await fetch(API_URL + '/health', {
                    mode: 'cors',
                    headers: {
                        'Origin': window.location.origin
                    }
                });
                resultEl.textContent = '✅ CORS is working! Status: ' + response.status;
                resultEl.className = 'success';
            } catch (error) {
                resultEl.textContent = '❌ CORS error: ' + error.message;
                resultEl.className = 'error';
            }
        }

        // Log when page loads
        console.log('Debug page loaded');
        console.log('API URL:', API_URL);
    </script>
</body>
</html>
