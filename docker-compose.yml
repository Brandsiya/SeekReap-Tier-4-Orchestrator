version: '3.8'
services:
  tier4-orchestrator:
    build: .
    ports:
      - "10000:10000"
    environment:
      - TIER1_NODES=json://nodes.json
  
  tier1-cpt:  # Cape Town
    image: seekreap/tier1:latest
    ports: ["10001:10001"]
  
  tier2-ml:    # ML Scoring
    image: seekreap/tier2-ml:latest
    ports: ["10002:10002"]
  
  tier3-quorum:
    image: seekreap/tier3:latest  
    ports: ["10003:10003"]
