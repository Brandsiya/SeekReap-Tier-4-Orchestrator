<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SeekReap - Tier 4 Content Verification</title>
    <link rel="stylesheet" href="static/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <header class="header">
        <div class="logo">
            <img src="static/images/logo.svg" alt="SeekReap" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMTIwIiBoZWlnaHQ9IjQwIiB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciPjxwYXRoIGQ9Ik0xMCAxMGMwIDQuNDEgMy41OSA4IDggOGg5NGMwLTQuNDEgMy41OS04IDgtOHoiIGZpbGw9IiM2NjdlZWEiLz48dGV4dCB4PSI2MCIgeT0iMjciIGZvbnQtZmFtaWx5PSJBcmlhbCIgZm9udC1zaXplPSIxOCIgZmlsbD0id2hpdGUiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGZvbnQtd2VpZ2h0PSJib2xkIj5TRUVLUkVBUA==';">
        </div>
        <div class="search-container">
            <input type="text" placeholder="Search for videos..." class="search-input">
        </div>
        <nav class="main-nav">
            <a href="index.html" class="nav-link active">Home</a>
            <a href="about.html" class="nav-link">About</a>
            <a href="whofor.html" class="nav-link">Who For</a>
            <a href="whyexists.html" class="nav-link">Why Exists</a>
            <a href="#pricing" class="nav-link">Pricing</a>
        </nav>
        <div class="header-actions">
            <button class="mobile-menu" onclick="toggleMobileNav()">
                <i class="fas fa-bars"></i>
            </button>
            <a href="auth.html" class="cta-button">Sign Up</a>
        </div>
    </header>

    <main>
        <section class="hero">
            <div class="hero-content">
                <h1>Verify Real Human Viewers</h1>
                <p class="hero-subtitle">Trusted by 50,000+ creators • 98.7% accuracy • 15 global nodes</p>
                <div class="verification-form">
                    <input type="text" id="videoId" placeholder="Enter Facebook Video ID (min 5 chars)" maxlength="50">
                    <button class="verify-btn" onclick="verifyVideo()">
                        <span class="btn-text">Verify Now</span>
                        <span class="btn-loader" style="display:none;"><i class="fas fa-spinner fa-spin"></i></span>
                    </button>
                    <div id="statusMessage" class="status-message"></div>
                </div>
                <div class="trust-badges">
                    <span><i class="fas fa-shield-alt"></i> SHA-256 Secured</span>
                    <span><i class="fas fa-globe"></i> 15 Global Nodes</span>
                    <span><i class="fas fa-bolt"></i> <8s Processing</span>
                </div>
            </div>
        </section>

        <section id="pricing" class="pricing">
            <h2>Choose Your Plan</h2>
            <div class="pricing-grid">
                <div class="price-card">
                    <h3>Test</h3>
                    <div class="price">$0.01</div>
                    <a href="https://www.paypal.com/cgi-bin/webscr?cmd=_s-xclick&hosted_button_id=YOUR_BUTTON1&custom=TEST" class="price-btn" target="_blank">Test Now</a>
                </div>
                <div class="price-card featured">
                    <h3>Starter</h3>
                    <div class="price">$0.99</div>
                    <a href="https://www.paypal.com/cgi-bin/webscr?cmd=_s-xclick&hosted_button_id=YOUR_BUTTON2&custom=STARTER" class="price-btn" target="_blank">Buy Now</a>
                </div>
                <div class="price-card">
                    <h3>Pro</h3>
                    <div class="price">$9.99</div>
                    <a href="https://www.paypal.com/cgi-bin/webscr?cmd=_s-xclick&hosted_button_id=YOUR_BUTTON3&custom=PRO" class="price-btn" target="_blank">Buy Pro</a>
                </div>
            </div>
        </section>
    </main>

    <script src="static/js/main.js"></script>
</body>
</html>
