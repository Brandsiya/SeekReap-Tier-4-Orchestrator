<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SeekReap - Facebook Monetization Verification</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; }
        
        /* SIMPLE, WORKING HEADER */
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 15px 20px;
        }
        
        .header-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .logo img {
            height: 40px;
            display: block;
        }
        
        .search-box {
            flex: 1;
            max-width: 400px;
            margin: 0 20px;
            display: flex;
            align-items: center;
            background: rgba(255,255,255,0.2);
            border-radius: 25px;
            padding: 8px 15px;
        }
        
        .search-box input {
            background: none;
            border: none;
            color: white;
            width: 100%;
            padding: 5px;
            font-size: 16px;
        }
        
        .search-box input::placeholder {
            color: rgba(255,255,255,0.7);
        }
        
        .search-box i {
            color: white;
            margin-right: 10px;
        }
        
        .nav-links {
            display: flex;
            gap: 15px;
            list-style: none;
        }
        
        .nav-links a {
            color: white;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 5px;
            transition: background 0.3s;
        }
        
        .nav-links a:hover {
            background: rgba(255,255,255,0.2);
        }
        
        .nav-links a.active {
            background: rgba(0,200,81,0.3);
            color: #00c851;
            font-weight: bold;
        }
        
        .header-right {
            display: flex;
            gap: 15px;
            align-items: center;
        }
        
        .mobile-menu-btn {
            display: none;
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
        }
        
        .sign-up-btn {
            background: #00c851;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            white-space: nowrap;
        }
        
        /* Simple hero section */
        .hero {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-align: center;
            padding: 80px 20px;
        }
        
        .hero h1 {
            font-size: 48px;
            margin-bottom: 20px;
        }
        
        @media (max-width: 768px) {
            .nav-links { display: none; }
            .mobile-menu-btn { display: block; }
            .search-box { margin: 10px 0; }
            .header-container { flex-wrap: wrap; }
        }
    </style>
</head>
<body>
    <!-- SIMPLE, WORKING HEADER -->
    <header class="header">
        <div class="header-container">
            <!-- Logo -->
            <div class="logo">
                <img src="logo.svg" alt="SeekReap">
            </div>
            
            <!-- Search Box -->
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" placeholder="Search for videos...">
            </div>
            
            <!-- Navigation Links -->
            <nav>
                <ul class="nav-links">
                    <li><a href="index.html" class="active">Home</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="whofor.html">Who It's For</a></li>
                    <li><a href="whyexists.html">Why It Exists</a></li>
                    <li><a href="#pricing">Pricing</a></li>
                </ul>
            </nav>
            
            <!-- Right Side -->
            <div class="header-right">
                <button class="mobile-menu-btn">☰</button>
                <a href="auth.html" class="sign-up-btn">Sign Up</a>
            </div>
        </div>
    </header>
    
    <!-- Simple Hero Section -->
    <section class="hero">
        <h1>Verify Facebook Monetization Instantly</h1>
        <p>Get SHA-256 certificates with 98.7% Facebook approval rate</p>
        <div style="margin-top: 30px;">
            <input type="text" placeholder="Enter Facebook Video ID" style="padding: 12px; width: 300px; border-radius: 8px; border: none;">
            <button style="padding: 12px 24px; background: #00c851; color: white; border: none; border-radius: 8px; margin-left: 10px; cursor: pointer;">
                VERIFY HUMAN
            </button>
        </div>
    </section>
    
    <!-- Simple JavaScript -->
    <script>
        // Add Font Awesome
        const fa = document.createElement('link');
        fa.rel = 'stylesheet';
        fa.href = 'https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css';
        document.head.appendChild(fa);
        
        // Mobile menu toggle
        document.querySelector('.mobile-menu-btn').addEventListener('click', function() {
            document.querySelector('.nav-links').style.display = 
                document.querySelector('.nav-links').style.display === 'flex' ? 'none' : 'flex';
        });
        
        // Simple verification
        function verifyVideo() {
            const videoId = document.querySelector('input[placeholder="Enter Facebook Video ID"]').value;
            if (!videoId) {
                alert('Please enter a video ID');
                return;
            }
            alert('Verifying: ' + videoId + '\n\nThis is a demo. In production, this would verify with Facebook.');
        }
        
        // Update button to use function
        document.querySelector('button').onclick = verifyVideo;
    </script>
</body>
</html>
