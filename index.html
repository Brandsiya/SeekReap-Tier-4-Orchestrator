<!DOCTYPE html><html><head><title>SeekReap Tier-0</title><meta name="viewport" content="width=device-width"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Inter',sans-serif;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh}.container{max-width:1200px;margin:0 auto;padding:20px}.header{text-align:center;color:white;margin-bottom:40px}.header h1{font-size:2.5rem;font-weight:700;margin-bottom:10px}.header p{font-size:1.2rem;opacity:0.9}.input-section{background:white;padding:40px;border-radius:20px;box-shadow:0 20px 40px rgba(0,0,0,0.1);margin-bottom:30px}.input-group{position:relative}.input-group input{width:100%;padding:20px 70px 20px 20px;font-size:1.1rem;border:2px solid #e1e5e9;border-radius:15px;font-family:'Inter',sans-serif;transition:all 0.3s}.input-group input:focus{outline:none;border-color:#667eea;box-shadow:0 0 0 3px rgba(102,126,234,0.1)}.verify-btn{position:absolute;right:10px;top:50%;transform:translateY(-50%);padding:15px 30px;background:linear-gradient(45deg,#00c851,#007e33);color:white;border:none;border-radius:10px;font-weight:600;font-size:1rem;cursor:pointer;transition:all 0.3s}.verify-btn:hover{transform:translateY(-50%) scale(1.05);box-shadow:0 10px 20px rgba(0,200,81,0.3)}.result-section{display:none;animation:slideIn 0.5s}.@keyframes slideIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}.verified{background:linear-gradient(135deg,#00c851,#007e33);color:white;padding:40px;border-radius:20px;text-align:center;box-shadow:0 20px 40px rgba(0,200,81,0.2)}.verified h2{font-size:2.2rem;margin-bottom:20px}.score-badge{display:inline-block;background:rgba(255,255,255,0.2);padding:10px 25px;border-radius:50px;font-size:1.3rem;font-weight:600;margin:10px 0;backdrop-filter:blur(10px)}.cert-section{background:white;padding:30px;border-radius:15px;margin:30px 0;box-shadow:0 10px 30px rgba(0,0,0,0.1)}.cert-id{font-family:'SF Mono',monospace;font-size:1.4rem;font-weight:700;color:#2c3e50;letter-spacing:1px;padding:20px;background:linear-gradient(90deg,#f8f9fa,#e9ecef);border-radius:10px;border-left:5px solid #667eea;margin-bottom:20px;word-break:break-all}.behaviors-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;margin:30px 0}.behavior-card{background:linear-gradient(135deg,#f8f9fa,#e9ecef);padding:25px;border-radius:15px;border-left:5px solid #667eea;transition:all 0.3s}.behavior-card:hover{transform:translateY(-5px);box-shadow:0 15px 35px rgba(0,0,0,0.1)}.behavior-header{font-weight:600;color:#2c3e50;margin-bottom:15px;font-size:1.1rem}.behavior-metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.metric{text-align:center;padding:10px}.metric-value{font-size:1.4rem;font-weight:700;color:#27ae60}.metric-label{font-size:0.85rem;color:#7f8c8d;text-transform:uppercase;letter-spacing:0.5px}.download-btn{width:100%;padding:18px;background:linear-gradient(45deg,#ff6b6b,#ee5a24);color:white;border:none;border-radius:12px;font-size:1.1rem;font-weight:600;cursor:pointer;margin-top:20px;transition:all 0.3s}.download-btn:hover{transform:scale(1.02);box-shadow:0 15px 30px rgba(255,107,107,0.4)}@media(max-width:768px){.container{padding:10px}.input-section{padding:25px}.header h1{font-size:2rem}}</style></head><body><div class="container"><div class="header"><h1>SeekReap Tier-0</h1><p>Global Human Verification • 15 Node Quorum</p></div><div class="input-section"><div class="input-group"><input id="reap_id" placeholder="Enter Facebook Video ID"/><button class="verify-btn" onclick="verify()">VERIFY HUMAN</button></div></div><div id="result" class="result-section"></div></div><script>let verificationData=null;async function verify(){const reap_id=document.getElementById('reap_id').value.trim();if(!reap_id)return alert('Enter Facebook Video ID');document.getElementById('result').innerHTML='<div class="verified"><div style="font-size:3rem;margin-bottom:20px">🔄</div><p>Analyzing 8 behavior sessions...</p></div>';document.querySelector('.result-section').style.display='block';try{const response=await fetch('/v4/verify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({reap_id})});verificationData=await response.json();displayResults(verificationData)}catch(e){document.getElementById('result').innerHTML='<div style="background:#ff6b6b;color:white;padding:40px;border-radius:20px;text-align:center"><div style="font-size:3rem;margin-bottom:20px">❌</div><h2>Verification Failed</h2></div>'}}function displayResults(data){const behaviorsHtml=data.behaviors.map(b=>`<div class="behavior-card"><div class="behavior-header">Session ${b.session_id.split('-').pop()}</div><div class="behavior-metrics"><div class="metric"><div class="metric-value">${b.playback_intensity}</div><div class="metric-label">Playback</div></div><div class="metric"><div class="metric-value">${b.viewport_intensity}</div><div class="metric-label">Viewport</div></div><div class="metric"><div class="metric-value">${b.volume_intensity}</div><div class="metric-label">Volume</div></div><div class="metric"><div class="metric-value">${b.mouse_entropy}</div><div class="metric-label">Mouse</div></div><div class="metric"><div class="metric-value">${b.timing_variance}</div><div class="metric-label">Timing</div></div><div class="metric"><div class="metric-value">${b.hover_consistency}</div><div class="metric-label">Hover</div></div><div class="metric"><div class="metric-value">${b.scroll_depth}</div><div class="metric-label">Scroll</div></div><div class="metric"><div class="metric-value">${b.pause_pattern}</div><div class="metric-label">Pause</div></div></div><div style="margin-top:15px;padding:10px;background:rgba(102,126,234,0.1);border-radius:8px;text-align:center"><strong>Score: ${b.weighted_score}</strong></div></div>`).join('');document.getElementById('result').innerHTML=`<div class="verified"><h2>✅ HUMAN VERIFIED</h2><div class="score-badge">Final Score: ${data.final_score}</div><p>Global Quorum: ${data.global_quorum}</p></div><div class="cert-section"><div class="cert-id">${data.certificate_id}</div><button class="download-btn" onclick="downloadCert()">📥 Download Certificate</button></div><div class="behaviors-grid">${behaviorsHtml}</div>`}function downloadCert(){const dataStr=JSON.stringify(verificationData,null,2);const dataUri='data:application/json;charset=utf-8,'+encodeURIComponent(dataStr);const exportFileDefaultName=`seekreap-cert-${verificationData.certificate_id.split('-').pop()}.json`;const linkElement=document.createElement('a');linkElement.setAttribute('href',dataUri);linkElement.setAttribute('download',exportFileDefaultName);linkElement.click()}</script></body></html>
