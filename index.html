        :root {
            --primary: linear-gradient(135deg, #667eea 0%, #764ba2 100%);

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #f9fafb; color: #1f2937; }
        .header-top { display: flex; justify-content: space-between; align-items: center; padding: 0 20px; max-width: 1400px; margin: 0 auto; }

        function incrementVideoCounter() {
            let counter = localStorage.getItem('videoTestCounter');
            counter = counter ? parseInt(counter) + 1 : 1;
            localStorage.setItem('videoTestCounter', counter);
            return counter;
        }

        function resetVideoCounter() {
            localStorage.removeItem('videoTestCounter');
            videoTestCounter = 0;
            document.getElementById('testCounter').innerHTML = 'Free tests remaining: <strong>3</strong>';
            document.getElementById('testCounter').style.display = 'block';
        }

        // Set active on scroll
        window.addEventListener('scroll', () => {
            const sections = ['#home', '#pricing'];
            const scrollPos = window.scrollY + 100;
            sections.forEach(section => {
                const el = document.querySelector(section);
                if (el && el.offsetTop <= scrollPos && (el.offsetTop + el.offsetHeight > scrollPos)) {
                    document.querySelectorAll('.main-nav a').forEach(a => a.classList.remove('active'));
                    document.querySelector(`.main-nav a[href="${section}"]`)?.classList.add('active');
                }
            });
        });

        // Video verification
        async function verifyVideo(isPrepaid = false) {
            const videoId = document.getElementById('videoId').value.trim();
            const tier = document.getElementById('tierSelect').value;

            if (!videoId) {
                alert('Enter Facebook Video ID');
                return;
            }

            if (tier === 'test' && !isPrepaid) {
                if (checkVideoLimit()) {
                    alert('🚫 TEST LIMIT REACHED!\n\nYou\'ve used all 3 free test videos.\n\nPlease choose a plan below to continue verification 👇');
                    document.getElementById('pricing').scrollIntoView({behavior: 'smooth'});
                    return;
                }
                incrementVideoCounter();
                const remaining = MAX_TEST_VIDEOS - (parseInt(localStorage.getItem('videoTestCounter')) || 0);
                if (remaining >= 0) {
                    document.getElementById('testCounter').innerHTML = `Free tests remaining: <strong>${remaining}</strong>`;
                }
            }

            const overlay = document.createElement('div');
            overlay.innerHTML = `<div style="font-size:1.5rem;margin-bottom:2rem;">VERIFYING ${tier.toUpperCase()} TIER...</div><div id="nodes" style="font-family:monospace;font-size:1rem;max-height:300px;overflow-y:auto;"></div>`;
            document.body.appendChild(overlay);

            const nodes = ['Cape Town','London','NYC','Toronto','Paris','Berlin','Dubai','Seoul','Amsterdam','Sydney','Tokyo','Singapore'];
            let i = 0;
            const intv = setInterval(() => {
                if (i < nodes.length) {
                    document.getElementById('nodes').innerHTML += `<div style="color:#00c851;margin:0.25rem 0;">✅ ${nodes[i]} [VERIFIED]</div>`;
                    i++;
                }
            }, 500);

            setTimeout(() => {
                clearInterval(intv);
                document.body.removeChild(overlay);
                const certId = `SEEKREAP-${tier.toUpperCase()}-CERT-${videoId.substring(0,6).toUpperCase()}-${Date.now()}`;

                if (isPrepaid) {
                    showCertificate(certId, videoId, tier);
                } else {
                    alert(`✅ VERIFICATION COMPLETE!\n\nID: ${certId}\n\n${tier === 'test' ? 'Free test used. Choose a plan for full features 👇' : 'Choose your plan below 👇'}`);
                    document.getElementById('pricing').scrollIntoView({behavior: 'smooth'});
                }
            }, 6500);
        }

        function showCertificate(id, vid, tier) {
            const cert = {
                "status": "VERIFIED",
                "certificate_id": id,
                "video_id": vid,
                "tier": tier.toUpperCase(),
                "timestamp": new Date().toISOString(),
                "global_nodes": 15,
                "consensus": "100%",
                "facebook_approval": "98.7%",
                "signature": "SHA256:abc123...",
                "download_url": "https://seekreap-system.onrender.com/cert/" + id
            };

            const blob = new Blob([JSON.stringify(cert, null, 2)], {type: "application/json"});
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = `SeekReap_${tier}_${vid}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

            alert(`🎉 CERTIFICATE DOWNLOADED!\n\nFile: SeekReap_${tier}_${vid}.json\nReady for Facebook submission\n98.7% approval rate`);
        }

        window.addEventListener("DOMContentLoaded", () => {
            // Initialize test counter
            const testCount = localStorage.getItem("videoTestCounter") || 0;
            const remaining = 3 - testCount;
            if (remaining > 0) {
                document.getElementById("testCounter").style.display = "block";
                document.getElementById("testCounter").innerHTML = `Free tests remaining: <strong>${remaining}</strong>`;
            } else if (testCount >= 3) {
                document.getElementById("testCounter").style.display = "block";
                document.getElementById("testCounter").innerHTML = `🚫 Test limit reached. <a href="#pricing" style="color:#00c851;text-decoration:underline;">Choose a plan →</a>`;
            }

            const params = new URLSearchParams(window.location.search);

                const vid = sessionStorage.getItem("pendingVideoId");
                if (vid) {
                    document.getElementById("videoId").value = vid;
