<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up / Sign In - SeekReap</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Inter',sans-serif;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem}
        .auth-container{background:white;max-width:450px;width:100%;border-radius:24px;padding:3rem;box-shadow:0 30px 80px rgba(0,0,0,0.3);position:relative}
        .back-btn{position:absolute;top:1.5rem;left:1.5rem;background:none;border:none;color:#667eea;font-size:1.5rem;cursor:pointer;transition:all 0.2s}
        .back-btn:hover{transform:scale(1.1)}
        .logo{margin-bottom:1.5rem}
        .logo img{height:36px}
        h1{text-align:center;margin-bottom:0.5rem;color:#1f2937;font-size:2.2rem;font-weight:700}
        .subtitle{text-align:center;color:#6b7280;margin-bottom:2.5rem;font-size:1.1rem}
        .auth-tabs{display:flex;border-bottom:2px solid #e5e7eb;margin-bottom:2rem}
        .tab-btn{flex:1;padding:1.25rem;font-weight:600;cursor:pointer;border:none;background:none;transition:all 0.2s;font-size:1rem}
        .tab-btn.active{border-bottom:3px solid #00c851;color:#00c851}
        .form-group{position:relative;margin-bottom:1.75rem}
        .form-group label{display:block;margin-bottom:0.75rem;font-weight:500;color:#374151;font-size:0.95rem}
        .input-wrapper{position:relative}
        .input-icon{position:absolute;left:1rem;top:50%;transform:translateY(-50%);color:#9ca3af;font-size:1.1rem;z-index:1}
        .form-group input{width:100%;padding:1.25rem 1rem 1.25rem 3rem;border:2px solid #e5e7eb;border-radius:12px;font-size:1rem;transition:all 0.2s;background:white}
        .form-group input:focus{border-color:#00c851;outline:none;box-shadow:0 0 0 3px rgba(0,200,81,0.1)}
        .checkbox-group{display:flex;align-items:center;gap:0.75rem;margin:1.5rem 0;font-size:0.95rem;color:#374151}
        .checkbox-group input{width:auto;margin:0}
        .checkbox-link{color:#00c851;text-decoration:none;font-weight:500;cursor:pointer}
        .cta-btn{width:100%;padding:1.25rem;background:#00c851;color:white;border:none;border-radius:12px;font-size:1.1rem;font-weight:600;cursor:pointer;transition:all 0.2s;margin:0.5rem 0}
        .cta-btn:hover{background:#00a843;transform:translateY(-1px)}
        .social-login{display:flex;gap:1rem;margin:2rem 0}
        .social-btn{flex:1;padding:1.25rem;border:2px solid #e5e7eb;border-radius:12px;text-decoration:none;font-weight:500;display:flex;align-items:center;justify-content:center;gap:0.75rem;transition:all 0.2s;font-size:0.95rem}
        .social-btn:hover{background:#f3f4f6;border-color:#d1d5db;transform:translateY(-1px)}
        .google-btn{color:#db4437;border-color:#db4437}
        .google-btn:hover{background:#db4437;color:white}
        .facebook-btn{color:#1877f2;border-color:#1877f2}
        .facebook-btn:hover{background:#1877f2;color:white}
        .toggle-link{color:#00c851;text-decoration:none;font-weight:500;display:block;text-align:center;margin-top:1rem}
        @media (max-width:480px){
            .auth-container{padding:2rem 1.5rem}
            h1{font-size:1.8rem}
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <button class="back-btn" onclick="window.location.href='/'">
            <i class="fas fa-arrow-left"></i>
        </button>
        
        <div class="logo">
            <img src="logo.svg" alt="SeekReap">
        </div>
        
        <p class="subtitle">Access your certificates & dashboard</p>

        <div class="auth-tabs">
            <button class="tab-btn active" onclick="switchTab('signup')">Sign Up</button>
            <button class="tab-btn" onclick="switchTab('signin')">Sign In</button>
        </div>

        <!-- Sign Up Form -->
        <form id="signupForm" style="display:block">
            <div class="form-group">
                <label>Email</label>
                <div class="input-wrapper">
                    <i class="fas fa-envelope input-icon"></i>
                    <input type="email" placeholder="your@email.com" required>
                </div>
            </div>
            <div class="form-group">
                <label>Password</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock input-icon"></i>
                    <input type="password" placeholder="Create password" required>
                </div>
            </div>
            <div class="form-group">
                <label>Confirm Password</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock input-icon"></i>
                    <input type="password" placeholder="Confirm password" required>
                </div>
            </div>
            <div class="checkbox-group">
                <input type="checkbox" id="remember">
                <label for="remember">Remember me</label>
            </div>
            <div class="checkbox-group">
                <input type="checkbox" id="terms" required>
                <label for="terms">I agree to <a href="terms.html" target="_blank" class="checkbox-link">Terms of Service</a> and <a href="privacy.html" target="_blank" class="checkbox-link">Privacy Policy</a></label>
            </div>
            <button type="submit" class="cta-btn">Create Account</button>
        </form>

        <!-- Sign In Form -->
        <form id="signinForm" style="display:none">
            <div class="form-group">
                <label>Email</label>
                <div class="input-wrapper">
                    <i class="fas fa-envelope input-icon"></i>
                    <input type="email" placeholder="your@email.com" required>
                </div>
            </div>
            <div class="form-group">
                <label>Password</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock input-icon"></i>
                    <input type="password" placeholder="Enter password" required>
                </div>
            </div>
            <div class="checkbox-group">
                <input type="checkbox" id="remember-signin">
                <label for="remember-signin">Remember me</label>
            </div>
            <button type="submit" class="cta-btn">Sign In</button>
            <a href="#" class="toggle-link">Forgot Password?</a>
        </form>

        <div style="text-align:center;margin:2rem 0;color:#6b7280;font-size:0.95rem">or continue with</div>
        <div class="social-login">
            <a href="#" class="social-btn google-btn">
                <i class="fab fa-google"></i> Google
            </a>
            <a href="#" class="social-btn facebook-btn">
                <i class="fab fa-facebook-f"></i> Facebook
            </a>
        </div>
    </div>

    <script>
        function switchTab(tab) {
            const signupForm = document.getElementById('signupForm');
            const signinForm = document.getElementById('signinForm');
            const tabs = document.querySelectorAll('.tab-btn');

            tabs.forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');

            if (tab === 'signup') {
                signupForm.style.display = 'block';
                signinForm.style.display = 'none';
            } else {
                signupForm.style.display = 'none';
                signinForm.style.display = 'block';
            }
        }

        document.getElementById('signupForm').addEventListener('submit', function(e) {
            e.preventDefault();
            if (!document.getElementById('terms').checked) {
                alert('Please accept Terms and Privacy Policy');
                return;
            }
            alert('✅ Account created! Welcome to SeekReap 🚀');
        });

        document.getElementById('signinForm').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('✅ Signed in successfully! Redirecting to dashboard...');
        });
    </script>
</body>
</html>
